<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: loja em grade (cabeçalho com logo, faixa amarela, categorias, cartões) e painel com menu lateral; mesmas cores do PDV Damião */
:root{
  --bar:#0b2a7a; --blue:#2563eb; --blue-ink:#1d4ed8; --sky:#e8efff; --yellow:#f5d23e; --yellow-ink:#0b2a7a; --red:#e53935; --green:#16a34a;
  --ink:#13213f; --muted:#6b7a99; --line:#dfe5f2; --bg:#ffffff; --page:#eef2fb; --warn-bg:#fff6cf; --warn:#7a5b00;
  --f:"Roboto","Segoe UI",system-ui,Arial,sans-serif; --fd:"Poppins","Segoe UI",system-ui,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-family:var(--fd);font-weight:600;font-size:14px;background:var(--blue);color:#fff;white-space:nowrap}
a.btn{text-decoration:none}
.btn.y{background:var(--yellow);color:var(--yellow-ink)}
.btn.g{background:var(--green)}
.btn.r{background:var(--red)}
.btn.o{background:var(--bg);color:var(--blue-ink);border:1px solid var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.field input,.field select,.field textarea,.inp{height:42px;padding:0 12px;border:1px solid #c9d3ea;border-radius:10px;background:var(--bg);width:100%}
.field textarea{height:auto;padding:10px 12px;min-height:72px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:#dcfce7;color:#166534}.p-wait{background:var(--warn-bg);color:var(--warn)}.p-bad{background:#fee2e2;color:#991b1b}.p-info{background:var(--sky);color:var(--blue-ink)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:#fff;padding:12px 18px;border-radius:10px;border-left:5px solid var(--yellow);z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(238,242,251,.7);z-index:55}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--sky);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.modal{position:fixed;inset:0;background:rgba(11,42,122,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--bg);border-radius:16px;width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg.wide{max-width:860px}
.dlg header{background:var(--bar);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:3px solid var(--yellow)}
.dlg header h3{font-size:16px}
.dlg header button{color:#fff;font-size:24px;line-height:1;width:32px}
.dlg .body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--page);padding:4px;border-radius:10px}
.tabs button{flex:1;height:36px;border-radius:8px;font-family:var(--fd);font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--bg);color:var(--blue-ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}.msg.bad{background:#fee2e2;color:#991b1b}.msg.ok{background:#dcfce7;color:#166534}.msg.info{background:var(--sky);color:var(--blue-ink)}
.link{color:var(--blue-ink);font-weight:500;text-decoration:underline;padding:0}
table.t{width:100%;border-collapse:collapse;background:var(--bg)}
.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#f6f8fd}
.t .r{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--fd);color:var(--ink);font-size:17px;margin-bottom:4px}

/* ===== LOJA ===== */
.shop-h{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20}
.shop-h .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.shop-h .logo{height:64px;border-radius:10px;flex:none}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;height:44px;border-radius:12px;border:0;padding:0 14px 0 42px;color:var(--ink)}
.search svg{position:absolute;left:12px;top:12px;width:20px;height:20px;color:var(--muted)}
.hbtn{display:flex;align-items:center;gap:8px;color:#fff;font-family:var(--fd);font-weight:600;font-size:14px;padding:8px 10px;border-radius:10px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.hbtn svg{width:24px;height:24px}
.cartbtn{position:relative;background:var(--yellow);color:var(--yellow-ink)}
.cartbtn:hover{background:#ffe066}
.cartbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.strip{background:var(--yellow);color:var(--yellow-ink);text-align:center;font-family:var(--fd);font-weight:600;font-size:14px;padding:7px 16px}
.catbar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:84px;z-index:15}
.catbar .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-family:var(--fd);font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-block:18px}
.hero div{background:var(--blue);color:#fff;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.hero b{font-family:var(--fd);display:block;font-size:14.5px}
.hero span{font-size:12.5px;opacity:.9}
.hero svg{width:28px;height:28px;flex:none;color:var(--yellow)}
.secth{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 12px}
.secth h2{font-size:21px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;padding-bottom:30px}
.pc{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc .img{aspect-ratio:1/1;max-width:100%;background:linear-gradient(160deg,#f3f6fd,#e3eafa);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.pc .img img{width:100%;height:100%;object-fit:contain;background:#fff}
.pc .img svg{width:56%;height:56%;opacity:.9}
.img .ico{display:contents}.img .ico[hidden]{display:none}.pd .img svg{width:56%;height:56%}
.pc .tag{position:absolute;top:10px;left:10px}
.pc .info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-family:var(--fd);font-weight:600;font-size:13.5px;line-height:1.3;cursor:pointer}
.pc .cd{font-size:12px;color:var(--muted)}
.pc .pr{font-family:var(--fd);font-weight:700;font-size:19px;color:var(--bar);margin-top:auto}
.pc .pr small{font-family:var(--f);font-size:12px;font-weight:400;color:var(--muted)}
.pc .act{display:flex;gap:6px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px;flex:none}
.qty button{width:34px;height:100%;font-weight:700;font-size:18px;color:var(--blue-ink);background:var(--sky)}
.qty input{width:44px;height:100%;border:0;text-align:center}
.pc .act .btn{flex:1;min-width:0;height:38px;padding:0 8px;font-size:13px}
.qty.sm button{width:30px}.pc .qty input{width:38px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:45;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px)}
.drawer header{background:var(--bar);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:3px solid var(--yellow)}
.drawer header button{color:#fff;font-size:26px;width:34px}
.drawer .items{flex:1;overflow:auto;padding:8px 16px}
.ci{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci .nm{font-weight:500;font-size:14px}
.ci .tt{font-family:var(--fd);font-weight:600;text-align:right}
.ci .rm{color:var(--red);font-size:13px}
.drawer footer{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tot{display:flex;justify-content:space-between;font-family:var(--fd);font-weight:700;font-size:20px;color:var(--bar)}
.shop-f{background:var(--bar);color:#d6defa;margin-top:20px;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));font-size:14px}
.shop-f .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.shop-f b{color:#fff;font-family:var(--fd);display:block;margin-bottom:6px}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.pd .img{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(160deg,#f3f6fd,#e3eafa);display:flex;align-items:center;justify-content:center;overflow:hidden;max-width:100%}
.pd .img img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ===== PAINEL ===== */
.adm{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--bar);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
.side .top{padding:16px;border-bottom:3px solid var(--yellow);display:flex;flex-direction:column;gap:10px}
.side .top img{width:120px;border-radius:10px}
.side .who{font-size:13px;opacity:.9}
.side .who b{display:block;font-family:var(--fd);font-size:15px;opacity:1}
.side nav{flex:1;overflow:auto;padding:10px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;color:#cfd9f7;font-family:var(--fd);font-weight:500;font-size:14.5px;text-align:left}
.side nav button svg{width:20px;height:20px;flex:none}
.side nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.side nav button[aria-current="true"]{background:var(--blue);color:#fff;box-shadow:inset 4px 0 0 var(--yellow)}
.side .bottom{padding:10px;border-top:1px solid rgba(255,255,255,.12)}
.main{padding-block:22px 40px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:24px}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cat-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:860px){.cat-grid{grid-template-columns:1fr}}
.cat-tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:520px){.cat-tipos{grid-template-columns:1fr}}
.cat-op{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}.cat-op:has(input:checked){border-color:var(--blue);background:var(--sky)}.cat-op span{display:grid;gap:2px}.cat-op input{width:18px;height:18px;margin-top:2px;flex:none}.cat-op small{color:var(--muted);font-size:12px;font-weight:400}
.cat-det{border-top:1px solid var(--line);padding:10px 0}.cat-det summary{cursor:pointer;font-weight:700;font-family:var(--fd);color:var(--bar)}
.cat-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}.cat-ck{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}.cat-ck small{color:var(--muted)}
.cat-share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.rel-card{padding:18px;display:flex;flex-direction:column;gap:10px}.rel-card h3{font-size:17px;color:var(--bar)}.rel-card p{color:var(--muted);font-size:14px;margin:0}.rel-info{font-size:13px;background:var(--page);border-radius:8px;padding:8px 10px}.rel-card>.btn{margin-top:auto}
.fin-abas{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 14px;overflow-x:auto}.fin-abas button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}.fin-abas button[aria-selected=true]{color:var(--blue-ink);border-color:var(--blue)}
.fin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fin-card{display:flex;gap:12px;align-items:center;padding:14px 16px}.fin-card>span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.fin-card small{display:block;color:var(--muted);font-size:13px}.fin-card b{font-size:20px;font-family:var(--fd)}
.fin-filtros{display:flex;gap:2px;background:var(--page);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}.fin-filtros button{padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}.fin-filtros button[aria-pressed=true]{background:var(--blue);color:#fff}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.up{margin:14px 0}.up-t{display:block;font-family:var(--fd);color:var(--bar);margin-bottom:8px}.up-l{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.up-c{flex:0 0 150px;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}.up-c img,.up-c .ico{width:100%;height:80px;object-fit:contain;display:grid;place-items:center}.up-c .ico svg{width:40px;height:40px}.up-n{font-size:13px;font-weight:600;line-height:1.25;flex:1}.up-p{font-weight:700;color:var(--bar)}
.rg-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.st-sel{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12.5px;font-weight:600;background:var(--sky);color:var(--blue-ink);max-width:170px}.st-sel.st-recebido{background:var(--warn-bg);color:var(--warn)}.st-sel.st-faturado,.st-sel.st-entregue{background:#dcfce7;color:#166534}.st-sel.st-cancelado{background:#fee2e2;color:#991b1b}
.st-lote{display:inline-flex;gap:6px;align-items:center}.st-lote select{height:40px;width:auto}
.sg-inp{width:130px;height:32px;text-transform:uppercase;font-weight:700;font-size:13px}
.np-faltam{margin-top:10px;padding:12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}.np-faltam-c{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.np-faltam-c select{flex:1;min-width:180px;height:38px}
.np-preco{width:96px;text-align:right;height:34px}.np-desc{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:4px;font-size:11px;color:var(--muted)}.np-desc input{width:54px;height:28px;text-align:right;font-size:12px;padding:2px 6px}.np-tab{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.np-desc-total input{width:84px;height:32px;text-align:right}
.cres{display:flex;flex-direction:column;gap:6px;font-size:14px}.cres>div:not(.msg){display:flex;justify-content:space-between}.cres .tot{font-weight:700;font-size:16px}
.rel-fmt{display:flex;gap:6px}.rel-fmt label{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;cursor:pointer}.rel-fmt label:has(input:checked){border-color:var(--blue);background:var(--sky);font-weight:600}
.pr-lote{position:sticky;top:0;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;padding:10px 12px;background:var(--sky);border:1px solid #c5d7fc;border-radius:10px}.pr-lote span{flex:1;min-width:150px;font-weight:600;color:var(--blue-ink)}
.pr-sw{position:relative;display:inline-block;vertical-align:middle;width:38px;height:22px;border-radius:999px;background:#cbd5e1;margin-right:6px;transition:background .15s}.pr-sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:left .15s}.pr-sw.on{background:var(--green)}.pr-sw.on i{left:19px}.pr-sw:disabled{opacity:.5}
tr.sel td{background:#f4f7ff}
.toolbar .inp{width:auto;flex:1;min-width:180px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:26px;color:var(--bar)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hl{background:var(--blue);border-color:var(--blue)}
.kpi.hl .l,.kpi.hl .s{color:#d6e2ff}.kpi.hl .v{color:#fff}
.kpi.hy{background:var(--yellow);border-color:var(--yellow)}
.kpi.hy .l,.kpi.hy .s{color:#5b4600}.kpi.hy .v{color:var(--yellow-ink)}
.charts{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.chartcard{padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chartcard h3{font-size:15px}
.chartcard .cv{position:relative;height:260px}
.mtop{display:none}
.sel-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px}
.chk{width:18px;height:18px}
/* rotas */
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rcard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.rcard:hover{border-color:var(--blue)}
.rcard b{font-family:var(--fd);font-size:17px}
.stops{display:flex;flex-direction:column;gap:10px}
.stop{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.stop.ok{opacity:.65;background:#f3fbf5}
.stop .n{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-family:var(--fd);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:17px}
.stop.ok .n{background:var(--green)}
.stop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.endp{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);padding:6px 4px}
.endp .dot{width:14px;height:14px;border-radius:50%;background:var(--yellow);border:3px solid var(--bar);flex:none}
.livebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#dcfce7;color:#166534;padding:10px 12px;border-radius:12px;font-weight:500}
.livebar.off{background:var(--sky);color:var(--blue-ink)}
.mapas{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.mapa{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapa iframe{width:100%;height:260px;border:0;display:block}
.mapa .info{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
#printArea{display:none}

  body *{visibility:hidden!important}

  #printArea{display:block;position:absolute;left:0;top:0;width:100%}
  .modal,.toast,.loading{display:none!important}
}

.pr-rom h1{font-size:16pt;margin:0 0 2mm}.pr-rom table{width:100%;border-collapse:collapse;margin-top:4mm}
.pr-rom th,.pr-rom td{border:1px solid #000;padding:2mm;text-align:left;vertical-align:top;font-size:10pt}
.pr-lbl{width:100mm;height:60mm;padding:3mm 4mm;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always;break-after:page;overflow:hidden;font-family:Arial,sans-serif;color:#000}
.pr-lbl .t{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.4mm solid #000;padding-bottom:1mm}

function modal(html,{wide,onClose}={}){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  $('#modais').appendChild(m);
  const fechar=()=>{m.remove();onClose&&onClose()};
  m.addEventListener('mousedown',e=>{if(e.target===m)fechar()});
  m.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=fechar);
  m.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
  const f=m.querySelector('input,select,textarea,button:not([data-fechar])');if(f)setTimeout(()=>f.focus(),30);
  m.fechar=fechar;return m;
}

const SIGLAS=new Set(['hao','hg','hp','hr','hpg','gm','gmg','gp','lfg','lfm','lfp','uai','bbq','m','g','p']);
const MINUSC=new Set(['de','da','do','das','dos','com','c/','e','em','x','para','s/','und','un','uns','uni','pct','cx','caixa','pacote','fardo','unidade','unidades','aproximadamente','gr']);
const ACENTO={damiao:'Damião',pao:'Pão',paes:'Pães',requeijao:'Requeijão',hamburguer:'Hambúrguer',hamburguers:'Hambúrgueres',guarana:'Guaraná',antartica:'Antarctica',familia:'Família',medahlao:'Medalhão',medalhao:'Medalhão',coracao:'Coração',linguica:'Linguiça',suina:'Suína',suino:'Suíno',gergilim:'Gergelim',economico:'Econômico',sache:'Sachê',galao:'Galão',oleo:'Óleo',perdigao:'Perdigão',frazao:'Frazão'};
function nomeLoja(nome){
  return String(nome||'').trim().replace(/\s+/g,' ').split(' ').map((t,i)=>{
    const m=t.match(/^([^0-9A-Za-zÀ-ÿ]*)(.*?)([.,;:)\-]*)$/),pre=m[1],w=m[2],pos=m[3],lw=w.toLowerCase(),base=norm(w);
    if(!w)return t;
    let r;
    if(/^\d+([.,]\d+)?(kg|g|gr|ml|l|un|und|uni)$/i.test(w))r=lw.replace(/l$/,'L').replace(/ml$/i,'ml');
    else if(/^c\/\d*/i.test(w)||/^s\//i.test(w))r=lw.replace(/(\d+)(und|un|uni)$/,'$1 und');
    else if(/^\d/.test(w))r=lw;
    else if(SIGLAS.has(base))r=w.toUpperCase();
    else if(i>0&&MINUSC.has(base))r=base==='uni'||base==='uns'?'und':lw;
    else if(ACENTO[base])r=ACENTO[base];
    else r=(lw.charAt(0).toUpperCase()+lw.slice(1)).replace(/-([a-zà-ÿ])/g,(x,c)=>'-'+c.toUpperCase());
    return pre+r+pos;
  }).join(' ');
}

function prepararCatalogo(cat){

function upsellPara(local,ids){

/* ---- pedido: imprimir e editar ---- */
function podeEditarPedido(){return !!ME&&['master','admin','operacional','vendedor'].includes(ME.papel);}
const PED_EDITAVEL=['Recebido','Em separação','Enviado ao Bling'];
const pedEditavel=p=>podeEditarPedido()&&(PED_EDITAVEL.includes(p.status)||(ME.papel==='master'&&['Faturado','Em rota'].includes(p.status)));
/* excluir pedidos: some do App e é cancelado no Bling (estorna estoque e contas). Master e Administrador. */
function excluirPedidos(lista,depois){
  lista=lista.filter(Boolean);if(!lista.length){toast('Selecione pelo menos um pedido.');return}
  const m=modal(`<header><h3>Excluir ${lista.length===1?'pedido #'+esc(lista[0].numero):lista.length+' pedidos'}</h3><button data-fechar>×</button></header><div class="body">
   <div class="msg bad"><b>Atenção:</b> ${lista.length===1?'o pedido sai':'os pedidos saem'} da lista do App e ${lista.length===1?'é cancelado':'são cancelados'} no Bling, com estorno de estoque e contas. Pedido com nota fiscal não é excluído.</div>
   <div class="scroll" style="max-height:220px"><table class="t"><thead><tr><th>Pedido</th><th>Cliente</th><th>Situação</th><th class="r">Total</th></tr></thead><tbody>${lista.map(p=>`<tr><td>#${esc(p.numero)}</td><td>${esc(p.cliente||'')}</td><td>${esc(p.status)}</td><td class="r num">${R$(p.total)}</td></tr>`).join('')}</tbody></table></div>
   <div class="field"><label for="exmot">Motivo da exclusão</label><textarea id="exmot" placeholder="Ex.: cliente desistiu, pedido duplicado"></textarea></div><div id="exres"></div></div>
   <footer><button class="btn o" data-fechar>Voltar</button><button class="btn" id="exok" style="background:var(--red)">Excluir ${lista.length===1?'pedido':lista.length+' pedidos'}</button></footer>`,{wide:true,onClose:()=>{if(feito)depois&&depois()}});
  let feito=false;const q=s=>m.querySelector(s);
  q('#exok').onclick=async()=>{const mot=q('#exmot').value.trim();if(mot.length<3){toast('Escreva o motivo da exclusão.');q('#exmot').focus();return}
    const b=q('#exok');b.disabled=true;const res=[];
    try{for(let i=0;i<lista.length;i+=5){b.textContent='Excluindo… '+Math.min(i+5,lista.length)+'/'+lista.length;res.push(...await api('excluirPedidos',{ids:lista.slice(i,i+5).map(p=>String(p.id)),motivo:mot}))}}catch(e){falha(e)}
    feito=res.some(r=>r.ok);const ok=res.filter(r=>r.ok),er=res.filter(r=>!r.ok);
    q('#exres').innerHTML=`<div class="msg ${er.length?'bad':'ok'}" style="margin-top:10px"><b>${ok.length} excluído(s)${er.length?', '+er.length+' com problema':''}.</b>${er.map(r=>`<div>#${esc(r.numero)}: ${esc(r.erro)}</div>`).join('')}${ok.filter(r=>r.aviso).map(r=>`<div style="font-size:12px">#${esc(r.numero)} (${esc(r.aviso)})</div>`).join('')}</div>`;
    b.hidden=true;if(!er.length){toast(ok.length+' pedido(s) excluído(s)');setTimeout(()=>m.fechar(),900)}};
}

     <table><thead><tr><th>Produto</th><th style="width:24mm">Código</th><th style="width:12mm">Un.</th><th style="width:22mm">Sistema</th><th style="width:24mm">Contado</th><th style="width:24mm">Diferença</th></tr></thead>
     <tbody>${L.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.codigo||'')}</td><td>${esc(x.unidade||'')}</td><td>${x.saldo==null?'':String(x.saldo).replace('.',',')}</td><td></td><td></td></tr>`).join('')}</tbody></table>
     <p style="margin-top:10mm">Assinatura: ______________________________ &nbsp; Data: ___/___/______</p></div>`,'size:A4;margin:0')};
  $('#eshist').onclick=async()=>{try{const h=await api('estoqueEntradas',{});modal(`<header><h3>Últimas entradas</h3><button data-fechar>×</button></header><div class="body"><div class="scroll"><table class="t"><thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd.</th><th>Por</th><th>Obs.</th><th>Bling</th></tr></thead><tbody>${h.map(e=>`<tr><td>${dth(e.data)}</td><td>${esc(e.produto)}</td><td class="r num">${String(e.quantidade).replace('.',',')}</td><td>${esc(e.usuario)}</td><td>${esc(e.obs||'')}</td><td>${e.erro?'<span class="pill p-bad">Erro</span>':'<span class="pill p-ok">Lançado</span>'}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma entrada ainda.</td></tr>'}</tbody></table></div></div>`,{wide:true})}catch(e){falha(e)}};

/* Entrada individual e em lote compartilham revisão, custo e proteção contra repetição. */
function estoqueValor(v){const s=String(v??'').trim();return s?Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s):NaN}
function estoqueRascunhoChave(){return 'dm_estoque_rascunho_'+ME.id}
function estoqueLerRascunho(){try{return JSON.parse(store.get(estoqueRascunhoChave())||'null')}catch(e){return null}}
function estoqueNovoRascunho(){return {id:crypto.randomUUID(),itens:[],fornecedor:'',obs:'',enviado:false}}
function abrirLancamentoEstoque(produtos,selecionado){
  let r=estoqueLerRascunho()||estoqueNovoRascunho(),editando=-1,busy=false;
  const salvar=()=>store.set(estoqueRascunhoChave(),JSON.stringify(r));
  const label=p=>(p.codigo?p.codigo+' · ':'')+p.nome;
  M().innerHTML=`<div class="ph"><div><h1>Novo lançamento</h1><p>Adicione os produtos recebidos e confira a compra antes de concluir.</p></div><button class="btn o sm" id="elvoltar">Voltar ao estoque</button></div>
    <div id="elaviso" role="status" aria-live="polite"></div>
    <form class="card" id="elitem" style="padding:18px;display:flex;flex-direction:column;gap:14px">
      <h3 style="font-size:16px">Adicionar produto</h3>
      <div class="field"><label for="elproduto">Produto</label><input id="elproduto" list="elprodutos" placeholder="Busque pelo nome ou código" autocomplete="off" required><datalist id="elprodutos">${produtos.map(p=>`<option value="${esc(label(p))}"></option>`).join('')}</datalist></div>
      <div id="elsaldo" style="font-size:13px;color:var(--muted)"></div>
      <div class="grid2"><div class="field"><label for="elpreco">Preço de compra unitário (R$)</label><input id="elpreco" inputmode="decimal" placeholder="0,00" required></div>
      <div class="field"><label for="elqtd">Quantidade recebida</label><input id="elqtd" inputmode="decimal" placeholder="Ex.: 10" required></div></div>
      <div><button class="btn" id="eladicionar" type="submit">Adicionar à lista</button> <button class="btn o" id="elcancelaredicao" type="button" hidden>Cancelar edição</button></div>
    </form>
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:12px"><h3 style="font-size:16px">Produtos do lançamento</h3><div id="ellista" class="scroll"></div><div id="eltotal" class="tot"></div></div>
    <form class="card" id="elfinal" style="padding:18px;display:flex;flex-direction:column;gap:14px">
      <h3 style="font-size:16px">Informações da compra</h3><div class="field"><label for="elfornecedor">Fornecedor</label><input id="elfornecedor" maxlength="150" value="${esc(r.fornecedor)}" placeholder="Nome do fornecedor" required></div>
      <div class="field"><label for="elobs">Observações</label><textarea id="elobs" maxlength="1000" placeholder="Nota fiscal, data do recebimento ou outras informações">${esc(r.obs)}</textarea></div>
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><span id="elrascunho" style="font-size:13px;color:var(--muted)">Rascunho salvo neste navegador.</span><button class="btn g" type="submit" id="elconcluir">Concluir lançamento de estoque</button></div>
    </form>`;
  const el=s=>$(s),produto=()=>produtos.find(p=>label(p)===el('#elproduto').value);
  const travar=()=>{$('#elitem input, #elitem button, #elfornecedor, #elobs, #ellista button').forEach(e=>e.disabled=r.enviado||busy);el('#elvoltar').disabled=busy;el('#elconcluir').disabled=busy||!r.itens.length;el('#elconcluir').textContent=busy?'Aguarde…':r.enviado?'Verificar lançamento':'Concluir lançamento de estoque';};
  const render=()=>{
    el('#ellista').innerHTML=r.itens.length?`<table class="t"><thead><tr><th>Produto</th><th class="r">Preço de compra</th><th class="r">Quantidade</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>${r.itens.map((i,n)=>`<tr><td><b>${esc(i.produto)}</b><div style="font-size:12px;color:var(--muted)">${esc(i.codigo)} · ${esc(i.unidade)}</div></td><td class="r num">${R$(i.precoCompra)}</td><td class="r num">${i.quantidade.toLocaleString('pt-BR')}</td><td class="r num">${R$(Math.round(i.precoCompra*i.quantidade*100)/100)}</td><td class="r"><button type="button" class="btn o sm" data-editar="${n}">Editar</button> <button type="button" class="btn o sm" data-remover="${n}">Remover</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty"><b>Nenhum produto adicionado</b>Escolha o produto, informe o preço e a quantidade e clique em Adicionar à lista.</div>';
    el('#eltotal').innerHTML=`<span>Total · ${r.itens.length} produto${r.itens.length===1?'':'s'}</span><span class="num">${R$(r.itens.reduce((s,i)=>s+Math.round(i.precoCompra*i.quantidade*100),0)/100)}</span>`;travar();
  };
  const limpar=()=>{editando=-1;el('#elitem').reset();el('#elsaldo').textContent='';el('#eladicionar').textContent='Adicionar à lista';el('#elcancelaredicao').hidden=true;};
  el('#elproduto').oninput=()=>{const p=produto();el('#elsaldo').textContent=p?'Saldo atual: '+(p.saldo==null?'—':Number(p.saldo).toLocaleString('pt-BR'))+' '+(p.unidade||''):'';};
  el('#elitem').onsubmit=e=>{
    e.preventDefault();if(busy||r.enviado)return;
    const p=produto(),q=estoqueValor(el('#elqtd').value),preco=estoqueValor(el('#elpreco').value);
    if(!p){toast('Escolha um produto da lista.');return}
    if(!Number.isFinite(q)||q<=0||q>1000000){toast('Informe uma quantidade maior que zero.');return}
    if(!Number.isFinite(preco)||preco<0||preco>10000000){toast('Informe um preço de compra válido.');return}
    const repetido=r.itens.findIndex((i,n)=>String(i.produtoId)===String(p.id)&&n!==editando);
    if(repetido>=0){toast('Esse produto já está na lista. Use Editar para ajustar o item.');return}
    if(editando<0&&r.itens.length>=50){toast('Cada lançamento pode ter até 50 produtos.');return}
    const i={produtoId:String(p.id),produto:p.nome,codigo:p.codigo||'',unidade:p.unidade||'',quantidade:q,precoCompra:Math.round(preco*100)/100};
    if(editando>=0)r.itens[editando]=i;else r.itens.push(i);salvar();limpar();render();el('#elproduto').focus();
  };
  el('#ellista').onclick=e=>{
    if(busy||r.enviado)return;
    const rem=e.target.closest('[data-remover]'),ed=e.target.closest('[data-editar]');
    if(rem){const n=+rem.dataset.remover;r.itens.splice(n,1);limpar();salvar();render();}
    if(ed){editando=+ed.dataset.editar;const i=r.itens[editando],p=produtos.find(p=>String(p.id)===String(i.produtoId));el('#elproduto').value=p?label(p):i.produto;el('#elpreco').value=i.precoCompra.toFixed(2).replace('.',',');el('#elqtd').value=String(i.quantidade).replace('.',',');el('#eladicionar').textContent='Salvar item';el('#elcancelaredicao').hidden=false;el('#elproduto').oninput();el('#elpreco').focus();}
  };
  el('#elcancelaredicao').onclick=limpar;
  el('#elfornecedor').oninput=()=>{r.fornecedor=el('#elfornecedor').value;salvar();};
  el('#elobs').oninput=()=>{r.obs=el('#elobs').value;salvar();};
  el('#elvoltar').onclick=()=>{if(!busy)vEstoque();};
  function resultado(x){
    if(x.estado==='concluido'){
      store.del(estoqueRascunhoChave());
      M().innerHTML=`<div class="ph"><div><h1>Lançamento concluído</h1><p>As entradas foram registradas no Bling.</p></div></div><div class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px"><div class="msg ok">${x.itens.length} produto${x.itens.length===1?'':'s'} lançado${x.itens.length===1?'':'s'} com sucesso.</div><div><b>Fornecedor:</b> ${esc(x.fornecedor)}</div><div><b>Total da compra:</b> ${R$(x.total)}</div>${x.obs?`<div><b>Observações:</b> ${esc(x.obs)}</div>`:''}<div style="font-size:13px;color:var(--muted)">Responsável: ${esc(x.usuario)} · ${dth(x.data)}<br>Lançamento ${esc(x.id)}</div><div><button class="btn" id="elestoque">Voltar ao estoque</button> <button class="btn o" id="eloutro">Novo lançamento</button></div></div>`;
      el('#elestoque').onclick=vEstoque;el('#eloutro').onclick=()=>abrirLancamentoEstoque(produtos);return;
    }
    const lancados=x.itens.filter(i=>i.estado==='lancado').length;
    el('#elaviso').innerHTML=`<div class="msg bad"><b>Lançamento aguardando conferência</b><p>${lancados} de ${x.itens.length} produtos confirmados. Os itens enviados não serão repetidos. Peça ao Master ou Administrador para conferir este lançamento no Bling.</p><div class="scroll"><table class="t"><thead><tr><th>Produto</th><th>Situação</th></tr></thead><tbody>${x.itens.map(i=>`<tr><td>${esc(i.produto)}</td><td>${i.estado==='lancado'?'Lançado':i.estado==='pendente'?'Não enviado':'Conferir no Bling'}</td></tr>`).join('')}</tbody></table></div><p style="font-size:12px">Referência: ${esc(x.id)}</p></div>`;
  }
  el('#elfinal').onsubmit=async e=>{
    e.preventDefault();if(busy||!r.itens.length)return;
    if(!r.enviado&&(editando>=0||el('#elproduto').value.trim()||el('#elpreco').value.trim()||el('#elqtd').value.trim())){toast('Adicione ou cancele o item em edição antes de concluir.');return}
    r.fornecedor=el('#elfornecedor').value.trim();r.obs=el('#elobs').value.trim();if(!r.fornecedor){toast('Informe o fornecedor.');return}
    r.enviado=true;salvar();busy=true;travar();
    try{const x=await api('estoqueLancamento',r);busy=false;travar();resultado(x);}

    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);

async function gerarCatalogoPDF(l,op,prog){

  const fotos={};if(op.foto){let n=0;for(const p of l){if(p.imagem&&!(p.imagem in fotos))fotos[p.imagem]=await imgDataURL(p.imagem);prog&&prog(++n)}}

      t(p.codigo?(p.codigo+' · '+(p.unidade||'UN')):(p.unidade||'UN'),x+3,yy+3,{s:7,c:[107,122,153]});yy+=7;

      if(op.est)t('Estoque: '+(p.estoque==null?'—':Number(p.estoque).toLocaleString('pt-BR')),x+3,yy+3,{s:7,c:[107,122,153]});

async function editarTabela(id,nome){

  const mud={};
  const m=modal(`<header><h3>Preços · ${esc(nome)}</h3><button data-fechar>×</button></header><div class="body"><div class="toolbar"><input class="inp" id="tb" placeholder="Buscar produto"><button class="btn o sm" id="tpct">Aplicar % sobre o Bling</button></div><div class="scroll" style="max-height:55vh;overflow:auto"><table class="t" id="tp"></table></div></div><footer><span id="tmud" style="margin-right:auto;color:var(--muted);font-size:14px"></span><button class="btn" id="tsv">Salvar preços</button></footer>`,{wide:true});
  const r=()=>{const ws=norm(m.querySelector('#tb').value).split(/\s+/).filter(Boolean);
    m.querySelector('#tp').innerHTML=`<thead><tr><th>Produto</th><th class="r">Bling</th><th class="r" style="width:140px">Preço na tabela</th></tr></thead><tbody>${cat.produtos.filter(p=>ws.every(w=>norm(p.nome+' '+p.codigo).includes(w))).map(p=>{const v=mud[p.id]!==undefined?mud[p.id]:(p.precoTabela?p.preco:'');return `<tr><td>${esc(p.nome)}<div style="font-size:12px;color:var(--muted)">${esc(p.codigo)}</div></td><td class="r num">${R$(p.precoBase)}</td><td class="r"><input class="inp num" style="height:36px;text-align:right" data-p="${p.id}" value="${v===''?'':String(v).replace('.',',')}" placeholder="${String(p.precoBase.toFixed(2)).replace('.',',')}"></td></tr>`}).join('')}</tbody>`;
    m.querySelector('#tmud').textContent=Object.keys(mud).length?Object.keys(mud).length+' alteração(ões) não salvas':''};
  r();m.querySelector('#tb').oninput=r;
  m.querySelector('#tp').oninput=e=>{const id=e.target.dataset.p;if(!id)return;const t=e.target.value.trim();mud[id]=t===''?'':+t.replace(/\./g,'').replace(',','.');m.querySelector('#tmud').textContent=Object.keys(mud).length+' alteração(ões) não salvas'};
  m.querySelector('#tpct').onclick=()=>{const box=m.querySelector('.body');if(box.querySelector('#pctbox'))return;box.insertAdjacentHTML('afterbegin',`<div class="sel-bar" id="pctbox">Somar <input class="inp" id="pctv" style="width:80px;height:36px" inputmode="decimal" placeholder="10">% ao preço do Bling em todos os produtos <button class="btn sm" id="pctok">Aplicar</button></div>`);
    box.querySelector('#pctok').onclick=()=>{const pc=parseFloat(String(box.querySelector('#pctv').value).replace(',','.'));if(isNaN(pc))return;cat.produtos.forEach(p=>{if(p.precoBase>0)mud[p.id]=Math.round(p.precoBase*(1+pc/100)*100)/100});r();toast('Preços calculados. Confira e salve.')}};
  m.querySelector('#tsv').onclick=async()=>{try{await api('salvarTabela',{id,precos:mud});toast('Preços salvos');m.fechar();vTabelas()}catch(x){falha(x)}};
}

const hojeStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const enc=encodeURIComponent;
const mapsDir=(o,d,w)=>'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+enc(o)+'&destination='+enc(d)+(w&&w.length?'&waypoints='+enc(w.join('|')):'');
const minTxt=m=>m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min';
let RASTREIO=null,ROM_ATUAL=null;
function pararRastreio(){if(RASTREIO!==null&&navigator.geolocation){navigator.geolocation.clearWatch(RASTREIO)}RASTREIO=null;clearInterval(pararRastreio.t)}
const AVISADOS=new Set();
function tratarEtas(r){if(!r||!r.etas)return;
  Object.entries(r.etas).forEach(([id,m])=>{const el=document.querySelector(`[data-eta="${id}"]`);if(el){el.textContent='Chega em ~'+minTxt(Math.max(1,m));el.hidden=false}});
  (r.manuais||[]).forEach(a=>{if(AVISADOS.has(a.pedidoId))return;AVISADOS.add(a.pedidoId);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
    const m=modal(`<header><h3>Avisar ${esc(a.cliente)}</h3><button data-fechar>×</button></header><div class="body">Faltam cerca de ${a.minutos} min para o pedido #${a.numero}. Toque para mandar o aviso de chegada pelo WhatsApp (a mensagem já vai pronta).</div><footer><button class="btn o" data-fechar>Agora não</button><a class="btn g" target="_blank" rel="noopener" href="${esc(a.link)}" data-fechar>Abrir WhatsApp</a></footer>`)})}
function iniciarRastreio(romId,onEstado){
  if(!navigator.geolocation){onEstado('erro','Este aparelho não informa a localização.');return}
  pararRastreio();let ult=null,enviado=0;
  RASTREIO=navigator.geolocation.watchPosition(p=>{ult=p.coords;onEstado('ok');if(Date.now()-enviado>25000){enviado=Date.now();api('posicaoMotorista',{lat:ult.latitude,lng:ult.longitude,precisao:Math.round(ult.accuracy||0),velocidade:ult.speed,romaneioId:romId},true).then(tratarEtas).catch(()=>{})}},
    e=>onEstado('erro',e.code===1?'Permita o acesso à localização para o Master acompanhar a rota.':'Não consegui pegar a localização.'),{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
  pararRastreio.t=setInterval(()=>{if(ult)api('posicaoMotorista',{lat:ult.latitude,lng:ult.longitude,precisao:Math.round(ult.accuracy||0),romaneioId:romId},true).then(tratarEtas).catch(()=>{})},60000);
}

/* nome curto do produto para etiqueta (cadastrado em Produtos; se vazio, resume o nome) */
function siglaAuto(n){let t=String(n||'').split(',')[0].replace(/\b(caixa|cx|pacote|pct|c\/|com|und|unid|unidades|de|da|do)\b.*$/i,'').trim();return (t||String(n||'')).toUpperCase().slice(0,18).trim()}
/* uma etiqueta por caixa de cada produto, só um produto por etiqueta: 9 cx de HG + 5 cx de DG = 9 etiquetas "HG" e 5 "DG" ("Caixa 1 de 14") */
const UN_CAIXA=/^(cx|cxs|caixa|caixas)\b/i;
function produtosEtiqueta(itens){const m=new Map();(itens||[]).forEach(i=>{const s=String(i.sigla||siglaAuto(i.nome)).trim(),q=(+String(i.qtd).replace(',','.'))||0;if(!s||q<=0)return;const x=m.get(s)||{sigla:s,nome:i.nome,qtd:0,unidade:i.unidade||'',caixa:false};x.qtd+=q;if(UN_CAIXA.test(String(i.unidade||'').trim()))x.caixa=true;m.set(s,x)});
  return [...m.values()].map(x=>({...x,n:x.caixa?Math.ceil(x.qtd):0}))}
function etiquetaHTML(o){const s=o.sigla||'',tam=s.length<=8?'gg':s.length<=14?'g':s.length<=22?'m':'p';
  return `<div class="pr-lbl"><div class="t"><span class="ped">Pedido ${esc(o.numero)}</span><span>${esc(o.topo||'')}</span></div><div><div class="cli">${esc(o.cliente||'')}</div><div class="cid">${esc(o.cidade||'')}</div></div><div class="sg sg-${tam}"><span>${esc(s)}${o.qtdTxt?` <small>×${esc(o.qtdTxt)}</small>`:''}</span></div><div class="ft"><span style="font-size:9pt">Damião Pães</span><span class="cx">Caixa ${o.k} de ${o.n}</span></div></div>`}
/* lista: [{numero,topo,cliente,cidade,itens}] — mostra produto por produto quantas etiquetas vão sair, permite corrigir e imprime */
async function janelaEtiquetas(lista){
  /* unidade e nome da etiqueta vêm do cadastro do produto (o pedido nem sempre guarda a unidade) */
  let porId={},porNome={};try{PRC_CAT=await api('produtosPainel',{});PRC_CAT.produtos.forEach(x=>{porId[String(x.id)]=x;porNome[norm(x.nome||'')]=x})}catch(e){}
  const completar=i=>{const c=porId[String(i.produtoId)]||porNome[norm(i.nome||'')]||{};return {...i,unidade:c.unidade||i.unidade||'',sigla:i.sigla||c.sigla||''}};
  const L=lista.map(p=>({...p,prods:produtosEtiqueta((p.itens||[]).map(completar))})).filter(p=>p.prods.length);
  if(!L.length){toast('Os pedidos escolhidos não têm itens.');return}

   <p style="margin:8px 0 0;font-weight:700">Total: <span id="ettot"></span> etiqueta(s)</p></div>
   <footer><button class="btn" id="etok">Imprimir etiquetas</button></footer>`,{wide:true});
  const ler=()=>{let t=0;m.querySelectorAll('[data-en]').forEach(e=>t+=Math.max(0,Math.min(200,parseInt(e.value)||0)));m.querySelector('#ettot').textContent=t;return t};
  m.querySelectorAll('[data-en]').forEach(e=>e.oninput=ler);ler();
  m.querySelector('#etok').onclick=()=>{let h='',tot=0;
    L.forEach((p,pi)=>{const prods=p.prods;const ns=prods.map((x,xi)=>Math.max(0,Math.min(200,parseInt(m.querySelector(`[data-en="${pi}-${xi}"]`).value)||0)));const N=ns.reduce((a,b)=>a+b,0);let k=0;

    if(!tot){toast('Nenhuma etiqueta para imprimir.');return}
    m.fechar();imprimir(h,'size:100mm 60mm;margin:0');toast(tot+' etiqueta(s) enviadas para impressão')};
}

  const carregar=async()=>{if(VIEW!=='rotas'||!$('#amapas')){clearInterval(acompanhar.t);return}
    try{const l=await api('posicoesMotoristas',{},true);
      $('#amapas').innerHTML=l.length?`<div class="mapas">${l.map(m=>{const min=Math.round((Date.now()-new Date(m.em))/60000);return `<div class="mapa"><iframe title="Mapa de ${esc(m.nome)}" loading="lazy" src="https://maps.google.com/maps?q=${m.lat},${m.lng}&z=15&output=embed"></iframe><div class="info"><b style="font-family:var(--fd);font-size:16px">${esc(m.nome)}</b><span>${m.romaneio?'Romaneio '+m.romaneio+' · '+m.entregues+' de '+m.paradas+' entregues':'Sem romaneio'}</span><span style="font-size:13px;color:${min>5?'var(--red)':'var(--muted)'}">${min<1?'Atualizado agora':'Atualizado há '+min+' min'}${min>5?' · o App pode ter sido fechado':''}</span><a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${m.lat},${m.lng}">Abrir no Google Maps</a></div></div>`}).join('')}</div>`:'<div class="empty"><b>Nenhum motorista com entregas abertas</b>A posição aparece quando o motorista toca em "Iniciar entregas" no romaneio.</div>';
    }catch(e){$('#amapas').innerHTML=`<div class="msg bad">${esc(e.message)}</div>`}};
  carregar();clearInterval(acompanhar.t);acompanhar.t=setInterval(carregar,30000);
}

boot();
</script>
